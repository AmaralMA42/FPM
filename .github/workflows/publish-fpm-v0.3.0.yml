name: Publish accepted FPM Research Companion v0.3.0 (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-fpm-v0.3.0.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'AmaralMA42/FPM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact accepted source
        uses: actions/checkout@v4
        with:
          ref: a02d4a35822af562f8bb785d8bb0041c38444c96
          persist-credentials: false
      - name: Verify exact source and manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a02d4a35822af562f8bb785d8bb0041c38444c96"
          test "$(git rev-parse HEAD^{tree})" = "a3b86261db3f1bca3adf21e6a2f5c3b8c7e8afb1"
          grep -q 'version: "0.3.0"' CITATION.cff
          test "$(git ls-files | wc -l)" -eq 36
          test "$(wc -l < SHA256SUMS.txt)" -eq 35
          sha256sum -c SHA256SUMS.txt
      - name: Build and verify clean ZIP
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/FPM_Research_Companion_v0.3.0.zip" HEAD
          unzip -t "$RUNNER_TEMP/FPM_Research_Companion_v0.3.0.zip"
          mkdir "$RUNNER_TEMP/fpm-check"
          unzip -q "$RUNNER_TEMP/FPM_Research_Companion_v0.3.0.zip" -d "$RUNNER_TEMP/fpm-check"
          cd "$RUNNER_TEMP/fpm-check"
          test "$(find . -type f | wc -l)" -eq 36
          sha256sum -c SHA256SUMS.txt
          sha256sum "$RUNNER_TEMP/FPM_Research_Companion_v0.3.0.zip"
      - name: Publish exact approved version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git ls-remote --tags origin 'refs/tags/v0.3.0' | awk '{print $1}')"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "a02d4a35822af562f8bb785d8bb0041c38444c96" ]; then
            echo 'Existing tag differs; refusing to retarget.' >&2
            exit 1
          fi
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/fpm-release-notes.md" <<'FPM_NOTES'
          FPM Research Companion v0.3.0 — optional persistent research workspace.
          Approved for publication by the author on 2026-11-24.

          - Bilingual declarative boot modules, initial setup and restart.
          - Optional minimal workspace with a stable entry, live state, catalog and locator anchor.
          - Natural-language research modes and scoped consolidation, preserving researcher authority.
          - Conversational use without installation remains supported.

          Continuity was demonstrated in the maintainer's existing project environment using a small deterministic engineering fixture. Fresh public installation, cross-provider portability and the effectiveness of every research mode have not been independently validated. Markdown does not install a backend or guarantee memory, access or automatic recovery.

          Existing Ising educational code and data, logo, attribution and GPL-3.0-only license remain unchanged. No unpublished research data or internal governing documents are included.

          The ZIP is built from the exact accepted source commit; all 35 manifest entries are checked before packaging and after clean extraction.
          FPM_NOTES
          gh release create v0.3.0 "$RUNNER_TEMP/FPM_Research_Companion_v0.3.0.zip" --repo "$GITHUB_REPOSITORY" --target "a02d4a35822af562f8bb785d8bb0041c38444c96" --title "FPM Research Companion v0.3.0" --notes-file "$RUNNER_TEMP/fpm-release-notes.md"
          gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease,assets
