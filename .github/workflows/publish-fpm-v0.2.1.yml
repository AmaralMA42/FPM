name: Publish accepted FPM Research Companion v0.2.1 (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-fpm-v0.2.1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'AmaralMA42/FPM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact accepted source
        uses: actions/checkout@v4
        with:
          ref: 43c3a2c6cd385cf22a7baddab6d8fb177bd03ae3
          persist-credentials: false
      - name: Verify exact source and manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "43c3a2c6cd385cf22a7baddab6d8fb177bd03ae3"
          test "$(git rev-parse HEAD^{tree})" = "a370db35fe5ddab5928399e1c07dbbef1ece19d8"
          grep -q 'version: "0.2.1"' CITATION.cff
          test "$(git ls-files | wc -l)" -eq 34
          test "$(wc -l < SHA256SUMS.txt)" -eq 33
          sha256sum -c SHA256SUMS.txt
      - name: Build and verify clean ZIP
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/FPM_Research_Companion_v0.2.1.zip" HEAD
          unzip -t "$RUNNER_TEMP/FPM_Research_Companion_v0.2.1.zip"
          mkdir "$RUNNER_TEMP/fpm-check"
          unzip -q "$RUNNER_TEMP/FPM_Research_Companion_v0.2.1.zip" -d "$RUNNER_TEMP/fpm-check"
          cd "$RUNNER_TEMP/fpm-check"
          test "$(find . -type f | wc -l)" -eq 34
          sha256sum -c SHA256SUMS.txt
          sha256sum "$RUNNER_TEMP/FPM_Research_Companion_v0.2.1.zip"
      - name: Publish exact approved version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git ls-remote --tags origin 'refs/tags/v0.2.1' | awk '{print $1}')"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "43c3a2c6cd385cf22a7baddab6d8fb177bd03ae3" ]; then
            echo 'Existing tag differs; refusing to retarget.' >&2
            exit 1
          fi
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/fpm-release-notes.md" <<'FPM_NOTES'
          Maintenance release of FPM Research Companion, approved by the author on 2026-11-24.
          
          - Preserves contextual proactive guidance in Portuguese and English.
          - When novelty depends on a model, algorithm or mechanism, compare the closest prior formulations, including equations, parameter mappings, limiting cases and initial conditions when relevant.
          - Preserve the researcher's scientific question when auxiliary metrics, diagnostics or exploratory findings compete with it.
          - Refreshes version metadata and the SHA-256 manifest.
          
          Existing Ising educational code and data, logo, attribution and GPL-3.0-only license are unchanged. No new scientific experiment, independent assistant efficacy evaluation or unpublished research data is included.
          
          The ZIP is built from the exact accepted source commit; the internal SHA-256 manifest is checked both before packaging and after clean extraction.
          FPM_NOTES
          gh release create v0.2.1 "$RUNNER_TEMP/FPM_Research_Companion_v0.2.1.zip" --repo "$GITHUB_REPOSITORY" --target "43c3a2c6cd385cf22a7baddab6d8fb177bd03ae3" --title "FPM Research Companion v0.2.1" --notes-file "$RUNNER_TEMP/fpm-release-notes.md"
          gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease,assets
